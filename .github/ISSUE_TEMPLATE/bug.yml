name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: example
    attributes:
      label: Minimal synthetic sample and command
      description: Do not include real training data, private prompts, or credentials.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version, .NET version, and operating system
    validations:
      required: true
